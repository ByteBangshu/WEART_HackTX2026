[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "weart-briefing"
version = "0.1.0"
description = "Local badge-to-professional-briefing system"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic>=2,<3", "httpx", "Pillow", "structlog", "PyYAML", "cryptography"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "pip-audit"]

[tool.setuptools.packages.find]
where = ["host/src"]

[tool.pytest.ini_options]
pythonpath = ["host/src"]
testpaths = ["host/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

